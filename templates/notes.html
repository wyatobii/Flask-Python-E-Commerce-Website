<h1>notes</h1>

<!-- Form to add a new note -->
<form method="POST" action="{{ url_for('mynotes') }}">
  <input type="text" name="note" required>
  <button type="submit">Add Note</button>
</form>

<ul>
  {% for note in notes %}
    <li>
      {{ note }}
      <a href="{{ url_for('edit_note', index=loop.index0) }}">Edit</a>
      <form action="{{ url_for('delete_note', index=loop.index0) }}" method="post" style="display:inline;">
        <button type="submit">Delete</button>
      </form>
    </li>
  {% else %}
    <li>No notes yet.</li>
  {% endfor %}
</ul>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Notes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url(static/piv.png); /* place your image in static/bg.jpg */
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }
    .container {
      background: rgba(255, 255, 255, 0.9);
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    h1 {
      text-align: center;
    }
    form {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }
    button {
      padding: 10px 16px;
      background: #2e86de;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      background: #f7f7f7;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 6px;
    }
    a {
      margin-right: 10px;
      text-decoration: none;
      color: #2e86de;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Notes</h1>
    <form method="POST" action="{{ url_for('mynotes') }}">
      <input type="text" name="note" required>
      <button type="submit">Add Note</button>
    </form>
    <ul>
      {% for note in notes %}
        <li>
          {{ note }}
          <a href="{{ url_for('edit_note', index=loop.index0) }}">Edit</a>
          <form action="{{ url_for('delete_note', index=loop.index0) }}" method="post" style="display:inline;">
            <button type="submit">Delete</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
